# Test-to-case mapping for the case management reporter (framework/reporting).
# Tests never name their case; this file does. Keys are test ids without
# parameters; one case may cover several tests or parameters.

[reporter]
# "dry-run" writes the request it would send instead of sending it.
adapter = "dry-run"

[cases]
"tests/bvt/test_account_access.py::test_registration_new_customer_logs_in" = "bvt.account.register-and-log-in"
