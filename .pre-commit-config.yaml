# Install once per clone:
#   uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: denylist-files
        name: deny-list (paths and contents)
        entry: uv run --frozen python tools/denylist_check.py files
        language: system
        pass_filenames: true
        stages: [pre-commit]

      - id: denylist-branch
        name: deny-list (branch name)
        entry: sh -c 'git rev-parse --abbrev-ref HEAD | uv run --frozen python tools/denylist_check.py text "branch name"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: denylist-message
        name: deny-list (commit message)
        entry: uv run --frozen python tools/denylist_check.py message
        language: system
        stages: [commit-msg]

      - id: secret-scan
        name: secret scan (gitleaks, staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner --config .gitleaks.toml
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-lint
        name: ruff (lint)
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-format
        name: ruff (format)
        entry: uv run --frozen ruff format --check --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]

      - id: mypy
        name: mypy (strict)
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: rule-check
        name: rule checker (anti-patterns and layers)
        entry: uv run --frozen python -m tools.rules_checker
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
