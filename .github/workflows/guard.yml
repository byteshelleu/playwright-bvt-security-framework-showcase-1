# Leak guard: runs on every push and pull request, before anything else.
# The deny-list comes from the DENYLIST repository secret; the job fails
# closed when the secret is missing (for example on pull requests from forks).
name: guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  denylist:
    name: deny-list check
    runs-on: ubuntu-latest
    env:
      DENYLIST: ${{ secrets.DENYLIST }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Unit tests for the checker
        run: uv run --frozen pytest -q tests/unit/test_denylist_check.py

      - name: Tracked files (paths and contents)
        run: uv run --frozen python tools/denylist_check.py files

      - name: Commit history of this ref (authors, messages, diffs)
        run: uv run --frozen python tools/denylist_check.py history HEAD

      - name: Branch name
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: printf '%s\n' "$BRANCH" | uv run --frozen python tools/denylist_check.py text "branch name"

      - name: Pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TEXT: ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_TEXT" | uv run --frozen python tools/denylist_check.py text "pull request"

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks over the history of this ref
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --log-opts=HEAD --config /repo/.gitleaks.toml --redact --no-banner --verbose
